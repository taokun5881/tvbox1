name: Safe Upstream Sync (Industrial Grade)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream --prune

      # =========================
      # 🧠 1. 自动识别默认分支
      # =========================
      - name: Detect branch
        id: branch
        run: |
          BRANCH=$(git symbolic-ref --short HEAD)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # =========================
      # 🔒 2. 关键文件保护（提前锁定）
      # =========================
      - name: Save protected files
        run: |
          mkdir -p /tmp/protect
          cp -f .github/workflows/sync-upstream.yml /tmp/protect/ || true

      # =========================
      # 🔥 3. 使用 rebase（更干净）
      # =========================
      - name: Rebase upstream
        run: |
          git checkout ${{ steps.branch.outputs.branch }}
          git rebase upstream/${{ steps.branch.outputs.branch }} || {
            echo "Rebase failed, aborting..."
            git rebase --abort || true
            exit 1
          }

      # =========================
      # 🔒 4. 恢复关键文件（强制不被 upstream 覆盖）
      # =========================
      - name: Restore protected files
        run: |
          cp -f /tmp/protect/sync-upstream.yml .github/workflows/sync-upstream.yml || true
          git checkout -- .github/workflows/sync-upstream.yml || true

      # =========================
      # 🧹 5. 自动清理冲突残留
      # =========================
      - name: Clean merge artifacts
        run: |
          git status --porcelain | grep "^UU" && exit 1 || true

      # =========================
      # 💾 6. Commit (only if needed)
      # =========================
      - name: Commit changes
        run: |
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sync upstream (industrial safe mode)"

      # =========================
      # 🚀 7. Push with safety
      # =========================
      - name: Push
        run: |
          git push origin HEAD:${{ steps.branch.outputs.branch }}
