name: Safe Enterprise Sync Engine (No Security Triggers)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: safe-sync-engine
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # =========================
      # 1️⃣ Fetch upstream
      # =========================
      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream --prune

      # =========================
      # 2️⃣ Create safe sync branch
      # =========================
      - name: Create sync branch
        run: |
          git checkout -b sync-staging upstream/master || \
          git checkout -b sync-staging upstream/main

      # =========================
      # 3️⃣ HARD EXCLUDE workflows (关键)
      # =========================
      - name: Remove protected directories
        run: |
          rm -rf .github/workflows || true

      # =========================
      # 4️⃣ Smart conflict policy
      # =========================
      - name: Apply sync rules
        run: |

          # JSON → use upstream version
          find . -name "*.json" -type f | while read f; do
            git checkout --theirs "$f" 2>/dev/null || true
            git add "$f" 2>/dev/null || true
          done

          # binary → keep local
          git checkout --ours jar/fan.txt 2>/dev/null || true
          git add jar/fan.txt 2>/dev/null || true

      # =========================
      # 5️⃣ Commit only safe files
      # =========================
      - name: Commit sync
        run: |
          git add -A
          git commit -m "safe upstream sync (no workflow touch)" || echo "no changes"

      # =========================
      # 6️⃣ Push sync branch ONLY
      # =========================
      - name: Push sync branch
        run: |
          git push origin sync-staging --force

      # =========================
      # 7️⃣ Create PR (SAFE ENTRY POINT)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync-staging
          base: master
          title: "Safe Upstream Sync (No Workflow Changes)"
          body: |
            Automated sync from upstream.
            - No workflow modifications included
            - JSON + code sync only
            - Binary files preserved safely
