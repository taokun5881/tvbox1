name: Safe Upstream Sync (Lock Workflow File)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/qist/tvbox.git || true
          git fetch upstream

      # =========================
      # 🔥 1. 同步 upstream（允许代码更新）
      # =========================
      - name: Merge upstream
        run: |
          git checkout master 2>/dev/null || git checkout main
          git merge upstream/master --no-edit 2>/dev/null || git merge upstream/main --no-edit

      # =========================
      # 🔒 2. 强制恢复单个关键文件（核心）
      # =========================
      - name: Protect sync workflow file
        run: |
          git checkout HEAD -- .github/workflows/sync-upstream.yml || true

      # =========================
      # 💾 3. 提交
      # =========================
      - name: Commit
        run: |
          git add .
          git commit -m "sync upstream (lock workflow file)" || echo "no changes"

      - name: Push
        run: |
          git push origin HEAD
