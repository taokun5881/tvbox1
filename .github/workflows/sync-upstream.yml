name: Enterprise Upstream Sync Engine (Zero Conflict)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-engine
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # =========================
      # 1️⃣ Add upstream
      # =========================
      - name: Add upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream --prune

      # =========================
      # 2️⃣ Detect branch
      # =========================
      - name: Detect branch
        id: branch
        run: |
          echo "branch=$(git symbolic-ref --short HEAD)" >> $GITHUB_OUTPUT

      # =========================
      # 3️⃣ Create staging branch (关键）
      # =========================
      - name: Create staging branch
        run: |
          git checkout -b sync-staging upstream/${{ steps.branch.outputs.branch }} || \
          git checkout -b sync-staging upstream/master

      # =========================
      # 4️⃣ Auto conflict resolver (核心)
      # =========================
      - name: Auto resolve conflicts safely
        run: |
          echo "Resolving conflicts with policy..."

          # JSON → 保留 upstream（或改成 ours）
          find . -name "*.json" -type f | while read f; do
            git checkout --theirs "$f" 2>/dev/null || true
            git add "$f" 2>/dev/null || true
          done

          # binary → 保留本地版本
          git checkout origin/${{ steps.branch.outputs.branch }} -- jar/fan.txt 2>/dev/null || true
          git add jar/fan.txt 2>/dev/null || true

      # =========================
      # 5️⃣ Merge upstream safely (no conflict allowed)
      # =========================
      - name: Safe merge upstream
        run: |
          git merge upstream/${{ steps.branch.outputs.branch }} --no-edit || true

      # =========================
      # 6️⃣ Restore protected files (关键锁）
      # =========================
      - name: Protect workflow files
        run: |
          git checkout origin/${{ steps.branch.outputs.branch }} -- .github/workflows/sync-upstream.yml || true

      # =========================
      # 7️⃣ Commit staging
      # =========================
      - name: Commit staging
        run: |
          git add -A
          git commit -m "sync upstream (enterprise zero-conf mode)" || echo "no changes"

      # =========================
      # 8️⃣ Push staging branch
      # =========================
      - name: Push staging
        run: |
          git push origin sync-staging --force

      # =========================
      # 9️⃣ OPTIONAL: auto PR (推荐开启)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync-staging
          base: ${{ steps.branch.outputs.branch }}
          title: "Enterprise Upstream Sync"
          body: "Automated zero-conf upstream sync"
          delete-branch: true
